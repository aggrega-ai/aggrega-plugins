[package]
name = "litellm-gateway-config"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
aggrega-pdk-rust = { path = "../../aggrega-pdk/rust" }
# The pipeline-step payload types and their codec, generated into the portable
# ABI crate the kit itself builds against.
aggrega-abi = { path = "../../aggrega-abi/rust" }
extism-pdk = "1.4"
serde_json = "1"
