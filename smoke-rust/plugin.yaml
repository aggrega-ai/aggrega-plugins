apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: smoke-rust
  pluginType: cli
  version: 0.1.0
  description: Report the argument vector from a Rust cli plugin.
  license: Apache-2.0
spec:
  abiVersion: v1alpha1
  exports:
    - name: cli_run
  runtime:
    hostFunctions:
      - aggrega_cli_write_stdout
  commands:
    - name: smoke-rust
      description: Report the argument vector from a Rust cli plugin.
